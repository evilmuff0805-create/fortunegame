name: fortunegame
description: "운세 동물 컴패니언 — 사주가 정해준 나만의 동물이 매일 운세를 건네는 앱 (점신PLAN.md 참조)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # D9 스택: Flutter + Supabase + Rive
  supabase_flutter: ^2.10.4
  rive: ^0.13.20
  share_plus: ^12.0.1
  flutter_local_notifications: ^19.5.0
  posthog_flutter: ^5.6.0
  flutter_riverpod: ^3.1.0
  path_provider: ^2.1.4   # 공유 카드 이미지 임시 저장
  timezone: ^0.10.0       # 로컬 푸시 KST 스케줄

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animals/
    - assets/items/
